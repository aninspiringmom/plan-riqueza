<script>
// ============================================
// VALORES — el deploy.yml inyecta estos
// ============================================
const CONVERTKIT_API_KEY='';
const CONVERTKIT_FORM_ID='';
const GOOGLE_SHEET_URL='https://script.google.com/macros/s/AKfycbwXHveOGOIC0VcHFmOuPmDQz4ThB_unhVMCy3xfnEvYhF6vW0I47BXqKb-bpo2VTKUeFw/exec';
const PDF_URL='';
// ============================================

const state = {
  nombre:'', email:'', telefono:'', perfil:'',
  ahorro:false, gastos:false, inversion:false, deudas:false,
  ensenanza:'', emocion:'', merecedora:false,
  meta:'', familia:'', legado:'',
  movimientos:[], extra:'', comprometida:false
};

let cur = 1;
const total = 6;
const selectedMovs = new Set();

function updateUI(){
  for(let i=1;i<=total;i++){
    const ps = document.getElementById('ps'+i);
    ps.className = 'prog-step'+(i<cur?' done':(i===cur?' active':''));
    document.getElementById('step'+i).className = 'step'+(i===cur?' active':'');
  }
  document.getElementById('pc').textContent = cur+'/'+total;
  document.getElementById('btn-back').style.display = cur>1?'':'none';
  document.getElementById('btn-next').style.display = cur<total?'':'none';
  document.getElementById('btn-finish').style.display = cur===total?'':'none';
  if(cur===total) buildCommitment();
  window.scrollTo(0,0);
}

function showError(id, msg){
  const el = document.getElementById(id);
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}
function hideError(id){
  const el = document.getElementById(id);
  if(el){ el.style.display = 'none'; }
}

function validateStep(){
  if(cur===1){
    hideError('err1');
    const nm = document.getElementById('f-nombre').value.trim();
    const em = document.getElementById('f-email').value.trim();
    const ph = document.getElementById('f-phone').value.trim();
    if(!nm){
      showError('err1','Por favor escribe tu nombre, amiga 🌸');
      return false;
    }
    if(!em || !em.includes('@') || !em.includes('.')){
      showError('err1','Necesito un email válido para enviarte el PDF');
      return false;
    }
    if(!ph){
      showError('err1','Necesito tu WhatsApp para enviarte el resumen');
      return false;
    }
    state.nombre   = nm;
    state.email    = em;
    state.telefono = (document.getElementById('f-prefix').value.trim()||'+1') + ph.replace(/\D/g,'');
    document.getElementById('cn').textContent = nm;
  }
  return true;
}

function next(){
  if(!validateStep()) return;
  if(cur < total){ cur++; updateUI(); }
}
function prev(){
  if(cur > 1){ cur--; updateUI(); }
}

function tog(btn, val, key){
  btn.closest('.toggle-row').querySelectorAll('.tog').forEach(b => b.className='tog');
  btn.classList.add(val==='yes'?'yes':'no');
  state[key] = val==='yes';
}

function oneChip(btn, group){
  const parent = btn.closest('.chips') || btn.parentElement;
  parent.querySelectorAll('.chip').forEach(b => b.classList.remove('on','pink-on'));
  btn.classList.add('on');
}

function toggleChip(btn){
  btn.classList.toggle('on');
}

function movChip(btn){
  if(btn.classList.contains('pink-on')){
    btn.classList.remove('pink-on');
    selectedMovs.delete(btn.textContent.trim());
  } else if(selectedMovs.size < 3){
    btn.classList.add('pink-on');
    selectedMovs.add(btn.textContent.trim());
  }
}

function buildCommitment(){
  const yesCount = document.querySelectorAll('.tog.yes').length;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-box">
      <span class="stat-val">${yesCount}</span>
      <span class="stat-lbl">bases ya activas</span>
    </div>
    <div class="stat-box">
      <span class="stat-val">${selectedMovs.size}</span>
      <span class="stat-lbl">acciones este mes</span>
    </div>`;
}

async function guardarEnSheets(){
  const emociones = [...document.querySelectorAll('#step3 .chip.on')]
    .map(c => c.textContent.trim()).join(', ');
  const perfilSeleccionado = document.querySelector('#step1 .chip.on')
    ?.textContent.trim() || '';
  const metaSeleccionada = document.querySelector('#step4 .chip.on')
    ?.textContent.trim() || '';

  const resp = await fetch(GOOGLE_SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nombre:          state.nombre,
      email:           state.email,
      telefono:        state.telefono,
      perfil:          perfilSeleccionado,
      tiene_ahorro:    state.ahorro,
      controla_gastos: state.gastos,
      tiene_inversion: state.inversion,
      tiene_deudas:    state.deudas,
      emocion_dinero:  emociones,
      merecedora:      state.merecedora,
      meta_ingresos:   metaSeleccionada,
      familia:         state.familia,
      legado:          state.legado,
      movimientos:     state.movimientos.join(' | '),
      ensenanza:       state.ensenanza,
      extra:           state.extra,
      comprometida:    true
    })
  });
  return resp;
}

async function suscribirEnConvertKit(){
  const perfilSeleccionado = document.querySelector('#step1 .chip.on')
    ?.textContent.trim() || '';
  const metaSeleccionada = document.querySelector('#step4 .chip.on')
    ?.textContent.trim() || '';

  const resp = await fetch(
    `https://api.convertkit.com/v3/forms/${CONVERTKIT_FORM_ID}/subscribe`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_key:    CONVERTKIT_API_KEY,
        first_name: state.nombre,
        email:      state.email,
        fields: {
          telefono:      state.telefono,
          perfil:        perfilSeleccionado,
          meta_ingresos: metaSeleccionada,
          movimientos:   state.movimientos.join(' | ')
        }
      })
    }
  );
  if(!resp.ok) throw new Error('ConvertKit error: ' + resp.status);
  return resp.json();
}

async function finish(){
  state.ensenanza    = document.getElementById('f-ensenanza').value.trim();
  state.familia      = document.getElementById('f-familia').value.trim();
  state.legado       = document.getElementById('f-legado').value.trim();
  state.extra        = document.getElementById('f-extra').value.trim();
  state.movimientos  = [...selectedMovs];
  state.comprometida = true;

  const fb = document.getElementById('btn-finish');
  fb.disabled = true;
  fb.textContent = 'Enviando tu plan...';
  document.getElementById('loading').classList.add('show');

  try {
    await Promise.all([
      guardarEnSheets(),
      suscribirEnConvertKit()
    ]);

    const waMsg = encodeURIComponent(
      `🌸 *Plan de Riqueza Consciente*\n_An Inspiring Mom_\n\n` +
      `Acabo de firmar mi compromiso financiero.\n\n` +
      `🎯 Mis movimientos este mes:\n${state.movimientos.join('\n')}\n\n` +
      `📥 PDF gratis: ${PDF_URL}\n\n` +
      `💪 ¡Mi legado empieza hoy!`
    );

    document.getElementById('btn-pdf').href = PDF_URL;
    document.getElementById('btn-wa').href  = `https://wa.me/?text=${waMsg}`;
    document.getElementById('success-msg').textContent =
      `Revisá tu email ${state.email} — el PDF ya está en camino 🌸`;

    document.getElementById('loading').classList.remove('show');
    document.getElementById('success-box').style.display = '';
    fb.textContent      = '¡Compromiso firmado! ✓';
    fb.style.background = '#1a7a4a';

  } catch(err){
    console.error('Error:', err);
    document.getElementById('loading').classList.remove('show');
    fb.disabled    = false;
    fb.textContent = 'Firmar mi compromiso ✨';
    alert('Hubo un error. Intenta de nuevo, amiga 🌸');
  }
}

updateUI();
</script>
